<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الموقع مغلق للصيانة</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Cairo", Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      background: rgba(0, 0, 0, 0.4);
      padding: 40px 25px;
      border-radius: 16px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    h1 {
      margin-bottom: 15px;
      font-size: 28px;
    }

    p {
      font-size: 16px;
      line-height: 1.8;
      opacity: 0.9;
    }

    .footer {
      margin-top: 30px;
      font-size: 14px;
      opacity: 0.7;
    }

    .footer span {
      color: #4fc3f7;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>الموقع مغلق مؤقتًا</h1>
    <p>
      نعمل حاليًا على تنفيذ بعض أعمال الصيانة والتحديثات  
      لتحسين الأداء وتقديم تجربة أفضل.
      <br>
      يرجى المحاولة مرة أخرى لاحقًا.
    </p>

    <div class="footer">
      تم التطوير بواسطة <span>محمد إيهاب قاسم</span>
    </div>
  </div>
</body>
</html>
